<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let pattern1 = () =>{
            document.writeln('<h2>Pattern 1</h2>')
            for(let i = 5; i>=1; i--){
                for(let j = 1; j<=i;j++){
                    document.writeln('S')
                }
                document.writeln('<br>')
            }
        }

        let pattern2 = () =>{
            document.writeln('<h2>Pattern 2</h2>')
            for(let i = 1; i<=5; i++){
                for(let j = 5; j>=i; j--){
                    document.writeln(j)
                }
                document.writeln('<br>')
            }
        }

        let pattern3 = () =>{
            document.writeln('<h2>Pattern 3</h2>')
            for(let i =1; i<=5;i++){
                for(let j=1; j<=i; j++){
                    document.writeln('&nbsp&nbsp')
                }
                for(k = i;k<=5; k++){
                    document.writeln('*')
                }
                document.writeln('<br>')
            }   
        }

        let isCheck = true
        
        while(isCheck){
            let option = prompt('Enter Your Option \n 1. Pattern 1 \n 2. Pattern 2 \n 3. Pattern 3 \n 4. Exit')

            switch(option){
                case '1': case 'a': case 'A':
                    pattern1()
                    break
                case '2': 
                    pattern2()
                    break
                case '3': 
                    pattern3()
                    break
                case '4': 
                    isCheck = false
                    break
                default:
                    alert('Enter Valid Option!')
                    break
            }
        }
    </script>
</body>
</html>
