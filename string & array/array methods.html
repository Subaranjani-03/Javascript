<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //splice - add,remove, update

        let fruits = ['apple' , 'banana' , 'orange' , 'lemon' , 'mango']

        console.log('before deletion : ',fruits)

        let del = fruits.splice(1)
        console.log('deleted : ',del)
        console.log('after deletion : ',fruits)

    </script>
</body>
</html>
