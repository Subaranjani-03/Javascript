<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patterns Using Nested For Loop</title>
</head>
<body>
    <script>
        document.writeln('<h3>Pattern - "SUBA"</h3>')
         // pattern - 'S'
        for(let i = 1; i<=5; i++){
            for(let j = 1; j<=5; j++){
                if(i==1 && j<=5){
                    document.writeln('*')
                }
                else if(i==2 && j==1){
                    document.writeln('*')
                }
                else if(i==3 && j<=5){
                    document.writeln('*')
                }
                else if(i==4 && j==5){
                    document.writeln('*')
                }
                else if(i==5 && j<=5){
                    document.writeln('*')
                }
                else{
                    document.writeln('&nbsp;&nbsp;')
                } 
            }
            document.writeln('<br>')
        }
        document.writeln('<br>')

        // pattern - 'U'
        for(let i = 1; i<=5; i++){
            
            for(let j = 1; j<=5; j++){
                if(i==1 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==2 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==3 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==4 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==5 && j<=5){
                    document.writeln('*')
                }
                else{
                    document.writeln('&nbsp;&nbsp;')
                } 
            }
            document.writeln('<br>')
        }
        document.writeln('<br>')

        // pattern - 'B'
        for(let i = 1; i<=5; i++){
            for(let j = 1; j<=5; j++){
                if(i==1 && j<=5){
                    document.writeln('*')
                }
                else if(i==2 && (j==2 || j==5)){
                    document.writeln('*')
                }
                else if(i==3 && j>=2){
                    document.writeln('*')
                }
                else if(i==4 && (j==2 || j==5)){
                    document.writeln('*')
                }
                else if(i==5 && j<=5){
                    document.writeln('*')
                }
                else{
                    document.writeln('&nbsp;&nbsp;')
                } 
            }
            document.writeln('<br>')
        }
        document.writeln('<br>')

        // pattern - 'A'
        for(let i = 1; i<=5; i++){
            for(let j = 1; j<=5; j++){
                if(i==1 && j<=5){
                    document.writeln('*')
                }
                else if(i==2 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==3 && j<=5){
                    document.writeln('*')
                }
                else if(i==4 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else if(i==5 && (j==1 || j==5)){
                    document.writeln('*')
                }
                else{
                    document.writeln('&nbsp;&nbsp;')
                } 
            }
            document.writeln('<br>')
        }


        // pattern - 'pyramid'
        document.writeln('<h3>Pattern - "Pyramid"</h3>')
        for(let i = 1; i<=45; i++){
            for(let j = 1; j<=9; j++){
                if(i==1 && j==5){
                    document.writeln('*')
                }
                else if(i==2 && (j>=4 && j<=6)){
                    document.writeln('*')
                }
                else if(i==3 && (j>=3 && j<=7)){
                    document.writeln('*')
                }
                else if(i==4 && (j>=2 && j<=8)){
                    document.writeln('*')
                }
                else if(i==5 && (j>=1 && j<=9)){
                    document.writeln('*')
                }
                else{
                    document.writeln('&nbsp;&nbsp;')
                } 
            }
            document.writeln('<br>')
        }
    </script>
</body>
</html>
